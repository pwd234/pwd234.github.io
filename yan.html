<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>来自头号粉丝的制作</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffeef2;
            font-family: "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        /* 花瓣容器 */
        .petal {
            position: fixed;
            background-color: #ffc8d6;
            border-radius: 50% 0 50% 50%;
            opacity: 0.7;
            animation: fall linear infinite;
            z-index: 0;
        }
        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }
        .title {
            text-align: center;
            font-size: 24px;
            color: #c85a78;
            margin-bottom: 40px;
        }
        .photo-item {
            margin-bottom: 50px;
            opacity: 0;
            transform: translateY(60px);
            transition: all 0.8s ease;
        }
        .photo-item.show {
            opacity: 1;
            transform: translateY(0);
        }
        .photo-item img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(200, 90, 120, 0.25);
            object-fit: cover;
        }
        .text-desc {
            margin-top:16px;
            text-align:center;
            font-size:17px;
            color:#883b54;
            line-height:1.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">来自头号粉丝的惊喜</div>

        <!-- 相册条目：一张图 + 一段话，复制新增就能加更多 -->
        <div class="photo-item">
            <img src="1.jpg" alt="照片">
            <div class="text-desc">能感觉出来你是一个很好的女孩子✨</div>
        </div>

        <div class="photo-item">
            <img src="2.jpg" alt="照片">
            <div class="text-desc">头号粉丝之所以是头号粉丝，绝不仅仅是因为你好看，更多是因为心地善良和声音好听</div>
        </div>

        <div class="photo-item">
            <img src="3.jpg" alt="照片">
            <div class="text-desc">不要一直冷落你的头号粉丝哦</div>
        </div>

        <div class="photo-item">
            <img src="4.jpg" alt="照片">
            <div class="text-desc">手上有事情可以先忙，但是不要长时间消失哦</div>
        </div>

        <div class="photo-item">
            <img src="5.jpg" alt="照片">
            <div class="text-desc">这是来自头号粉丝的制作，希望你对头号粉丝好一些哦，不要一直消失！</div>
        </div>
    </div>

    <script>
        // 滚动浮现
        const items = document.querySelectorAll('.photo-item');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting){
                    entry.target.classList.add('show');
                }
            })
        }, {threshold:0.15});
        items.forEach(el=> observer.observe(el));

        // 生成飘落花瓣
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            // 随机大小、位置、下落时长
            const size = Math.random() * 12 + 6;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 5 + 4 + 's';
            document.body.appendChild(petal);
            // 花瓣落地移除
            setTimeout(()=>petal.remove(), 9000);
        }
        setInterval(createPetal, 400);
    </script>
</body>
</html>
