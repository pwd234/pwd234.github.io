<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送给你的惊喜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffeef2;
            font-family: "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .title {
            text-align: center;
            font-size: 24px;
            color: #c85a78;
            margin-bottom: 40px;
        }
        .photo-item {
            margin-bottom: 50px;
            opacity: 0;
            transform: translateY(60px);
            transition: all 0.8s ease;
        }
        .photo-item.show {
            opacity: 1;
            transform: translateY(0);
        }
        .photo-item img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(200, 90, 120, 0.25);
            object-fit: cover;
        }
        .text-desc {
            margin-top:16px;
            text-align:center;
            font-size:17px;
            color:#883b54;
            line-height:1.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">致我最喜欢的女孩</div>

        <!-- 相册条目：一张图 + 一段话，复制新增就能加更多 -->
        <div class="photo-item">
            < img src="1.jpg" alt="照片">
            <div class="text-desc">第一次见到你的时候，就觉得你闪闪发光✨</div>
        </div>

        <div class="photo-item">
            < img src="2.jpg" alt="照片">
            <div class="text-desc">和你相处的每一刻，都值得好好珍藏</div>
        </div>

        <div class="photo-item">
            < img src="3.jpg" alt="照片">
            <div class="text-desc">希望往后的日子，能一直陪在你身边</div>
        </div>

        <div class="photo-item">
            < img src="4.jpg" alt="照片">
            <div class="text-desc">你值得世间所有温柔与美好</div>
        </div>

        <div class="photo-item">
            < img src="5.jpg" alt="照片">
            <div class="text-desc">这是专属于我们的小浪漫，惊喜送给你💌</div>
        </div>
    </div>

    <script>
        // 滚动监听，进入视口就浮现
        const items = document.querySelectorAll('.photo-item');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting){
                    entry.target.classList.add('show');
                }
            })
        }, {threshold:0.15});

        items.forEach(el=> observer.observe(el));
    </script>
</body>
</html>
